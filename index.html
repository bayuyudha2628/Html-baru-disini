<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form penghitung pengeluaran</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
 <div class="container">
  <a class="navbar-brand" href="#"> Pencatat Pengeluaran
  </a>
 </div>
</nav>

<div class="container mt-5">
<div class="row g-4">

  <!-- Bagian Form -->
<div class="col-md-5">
<div class="card shadow">

 <div class="card-header"> Masukan Daftar Pengeluaran

 </div>

 <div class="card-body">
 <form id="expenseForm">
 <div class="mb-3">
                            <label class="form-label">
                                Nama Pengeluaran
                            </label>

                            <input
                                type="text"
                                id="nama"
                                class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Nominal
                            </label>

                            <input
                                type="number"
                                id="nominal"
                                class="form-control">
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Tambah
                        </button>

                    </form>

                </div>

  </div>

   </div>

        <!-- Bagian List kah? harusnya-->
 <div class="col-md-7">

 <div class="card shadow">

<div class="card-header"> Daftar Pengeluaran
</div>

<div class="card-body">

<table class="table table-striped">

 <thead>
 <tr>
    <th>No</th>
    <th>Nama</th>
    <th>Nominal</th>
 </tr>
 </thead>

 <tbody id="expenseList">

 </tbody>

</table>

</div>
  </div>
    </div>
     </div>

</div>

<script src="index.js"></script>

</body>
</html>
