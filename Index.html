 <div class="collapse navbar-collapse"

   <div class="col-md-6">

 <div class="card shadow">
   
 <div class="card-header bg-primary text-white"> Form Pesan
 
 </div>

 <div class="card-body">
 <form id="messageForm">

   <div class="mb-3">

 <label class="form-label"> Nama
 
</label>

<input
type="text"
id="nama"
class="form-control"
required>
   </div>

   <div class="mb-3">

 <label class="form-label"> Pesan
 
 </label>

 <textarea
id="pesan"
class="form-control"
rows="4"
required></textarea>
   </div>

 <button
type="submit"
class="btn btn-primary"> Submit
</button>

</form>

 </div>
   </div>

   </div>


   <div class="col-md-6">

   <div class="card shadow">

   <div class="card-header bg-success text-white"> Daftar Pesan
   </div>

  <div class="card-body">

  <ul id="messageList"
class="list-group">
    
  </ul>

</div>

</div>

  </div>
